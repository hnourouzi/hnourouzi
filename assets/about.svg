<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-label="About Hossein Nourouzi">
<style>
text{font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.a{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.pl{animation:pulse 2.4s ease-in-out infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
.cb{animation:blink 1s steps(1) infinite}
.p{opacity:0;animation:pop .55s ease-out forwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.a,.p{opacity:1}}
</style>
<rect x="1" y="1" width="998" height="368" rx="14" fill="#131316" stroke="#26262c"/>
<path d="M1 52H999" stroke="#26262c"/>
<circle cx="28" cy="27" r="6" fill="#d92e16"/><circle cx="50" cy="27" r="6" fill="#3a3a42"/><circle cx="72" cy="27" r="6" fill="#3a3a42"/>
<text x="500" y="31" font-size="13" text-anchor="middle" fill="#a0a0ad">About</text>
<text class="a" x="36" y="94" font-size="15" style="animation-delay:0.2s" xml:space="preserve"><tspan fill="#ff7058">$ </tspan><tspan fill="#ececf0">whoami</tspan></text>
<text class="a" x="36" y="118" font-size="15" style="animation-delay:0.5s" xml:space="preserve"><tspan fill="#a0a0ad">Hossein Nourouzi — Backend Developer</tspan></text>
<text class="a" x="36" y="160" font-size="15" style="animation-delay:0.9s" xml:space="preserve"><tspan fill="#ff7058">$ </tspan><tspan fill="#ececf0">cat focus.md</tspan></text>
<text class="a" x="36" y="184" font-size="15" style="animation-delay:1.2s" xml:space="preserve"><tspan fill="#ff7058">→ </tspan><tspan fill="#a0a0ad">Software architecture &amp; system design</tspan></text>
<text class="a" x="36" y="208" font-size="15" style="animation-delay:1.5s" xml:space="preserve"><tspan fill="#ff7058">→ </tspan><tspan fill="#a0a0ad">Laravel APIs &amp; business systems (e-commerce, ERP, fintech)</tspan></text>
<text class="a" x="36" y="232" font-size="15" style="animation-delay:1.8s" xml:space="preserve"><tspan fill="#ff7058">→ </tspan><tspan fill="#a0a0ad">Clean Architecture, queues, caching, database design</tspan></text>
<text class="a" x="36" y="274" font-size="15" style="animation-delay:2.2s" xml:space="preserve"><tspan fill="#ff7058">$ </tspan><tspan fill="#ececf0">uptime</tspan></text>
<text class="a" x="36" y="298" font-size="15" style="animation-delay:2.5s" xml:space="preserve"><tspan fill="#a0a0ad">2+ years shipping · 10+ projects &amp; features delivered</tspan></text>
<text class="a" x="36" y="334" font-size="15" style="animation-delay:2.9s" xml:space="preserve"><tspan fill="#ff7058">$ </tspan><tspan class="cb" fill="#ff7058">_</tspan></text>
<g class="a" style="animation-delay:.4s"><rect x="700" y="72" width="262" height="262" rx="12" fill="none" stroke="#3a3a42" stroke-dasharray="4 6"/><text x="716" y="94" font-size="11" fill="#a0a0ad">FRAMEWORKS · DB · QUEUES</text></g>
<g class="a" style="animation-delay:.8s"><rect x="716" y="106" width="230" height="214" rx="10" fill="#1a1a1f" stroke="#3a3a42"/><text x="730" y="128" font-size="11" fill="#a0a0ad">CONTROLLERS · API · BLADE</text></g>
<g class="a" style="animation-delay:1.2s"><rect x="732" y="140" width="198" height="166" rx="8" fill="#0c0c0e" stroke="#d92e16" stroke-opacity=".6"/><text x="746" y="162" font-size="11" fill="#ff7058">USE CASES</text></g>
<g class="a" style="animation-delay:1.6s"><rect x="750" y="176" width="162" height="116" rx="8" fill="#d92e16" fill-opacity=".16" stroke="#d92e16" stroke-width="1.5"/><text class="pl" x="831" y="239" font-size="14" font-weight="700" text-anchor="middle" fill="#ececf0">DOMAIN</text><text x="831" y="258" font-size="10" text-anchor="middle" fill="#a0a0ad">entities · rules</text></g>
<text class="a" x="831" y="352" font-size="10" text-anchor="middle" fill="#a0a0ad" style="animation-delay:2s">dependencies point inward</text>

