<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Hossein Nourouzi, Backend Developer">
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#d92e16" stop-opacity=".38"/><stop offset="1" stop-color="#d92e16" stop-opacity="0"/></radialGradient>
</defs>
<style>
text{font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.a{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.pl{animation:pulse 2.4s ease-in-out infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
.cb{animation:blink 1s steps(1) infinite}
.p{opacity:0;animation:pop .55s ease-out forwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.a,.p{opacity:1}}

.sp{transform-origin:830px 130px;animation:spin 48s linear infinite}
.sr{transform-origin:830px 130px;animation:spinr 32s linear infinite}
</style>
<rect x="1" y="1" width="998" height="258" rx="16" fill="#0c0c0e" stroke="#26262c"/>
<rect x="1" y="1" width="998" height="258" rx="16" fill="url(#grid)"/>
<circle cx="830" cy="130" r="170" fill="url(#glow)"/>
<g class="sp"><circle cx="830" cy="130" r="112" fill="none" stroke="#d92e16" stroke-opacity=".6" stroke-width="2" stroke-dasharray="3 9"/><circle cx="942" cy="130" r="5" fill="#ff7058"/></g>
<circle cx="830" cy="130" r="86" fill="none" stroke="#3a3a42" stroke-width="1.5"/>
<g class="sr"><circle cx="830" cy="130" r="62" fill="none" stroke="#ff7058" stroke-opacity=".8" stroke-width="2" stroke-dasharray="38 14"/><circle cx="768" cy="130" r="4" fill="#ececf0"/></g>
<circle cx="830" cy="130" r="38" fill="#131316" stroke="#d92e16" stroke-width="1.5"/>
<circle class="pl" cx="830" cy="130" r="14" fill="#d92e16"/>

<text class="a" x="64" y="66" font-size="15" fill="#a0a0ad" style="animation-delay:.1s" xml:space="preserve"><tspan fill="#ff7058">hnourouzi</tspan> $ whoami<tspan class="cb" fill="#ff7058"> _</tspan></text>
<text class="a sans" x="62" y="128" font-size="56" font-weight="700" fill="#ececf0" letter-spacing="-1.5" style="animation-delay:.25s">Hossein <tspan fill="#ff7058">Nourouzi</tspan></text>
<text class="a" x="64" y="166" font-size="20" font-weight="700" fill="#ececf0" style="animation-delay:.4s">Backend Developer</text>
<text class="a" x="64" y="192" font-size="15" fill="#a0a0ad" style="animation-delay:.5s">Software architecture · System design · Laravel</text>
<g class="a" style="animation-delay:.65s">
<rect x="64" y="212" width="236" height="30" rx="15" fill="#131316" stroke="#26262c"/>
<circle class="ping" cx="84" cy="227" r="4" fill="#2ecc71"/><circle cx="84" cy="227" r="4" fill="#2ecc71"/>
<text x="98" y="232" font-size="13" fill="#a0a0ad">Available for new projects</text>
</g>
</svg>
