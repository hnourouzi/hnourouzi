<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="424" viewBox="0 0 1000 424" role="img" aria-label="Tech stack">
<style>
text{font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.a{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.pl{animation:pulse 2.4s ease-in-out infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
.cb{animation:blink 1s steps(1) infinite}
.p{opacity:0;animation:pop .55s ease-out forwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.a,.p{opacity:1}}
</style>
<rect x="0" y="0" width="1000" height="104" rx="12" fill="#131316" stroke="#26262c"/>
<rect x="24" y="22" width="10" height="10" rx="2" fill="#d92e16"/>
